<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGUAI Smart Cup</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600">SGUAI Smart Cup</h1>
            <p class="text-gray-600">Connect and control your smart cup</p>
        </header>

        <!-- Device Connection Panel -->
        <div id="connectionPanel" class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Device Connection</h2>
            <div class="flex items-center space-x-4">
                <button id="connectButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Connect to Device
                </button>
                <button id="skipButton" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                    Skip Connection
                </button>
                <div id="deviceStatus" class="text-gray-600">
                    Not connected
                </div>
            </div>
            <div id="errorMessage" class="mt-2 text-red-500 hidden"></div>
        </div>

        <!-- Main Content Area -->
        <div id="mainContent" class="hidden">
            <div class="flex flex-col md:flex-row gap-6">
                <!-- Navigation Sidebar -->
                <div class="md:w-1/4">
                    <div class="bg-white rounded-lg shadow-md p-4">

                        <div class="mb-4 pb-4 border-b border-gray-200">
                            <button id="sidebarConnectBtn"
                                class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded flex items-center justify-center gap-2">
                                <span>🔗</span> Connect Device
                            </button>
                        </div>

                        <!-- Device Status Card (shown when connected) -->
                        <div id="deviceStatusCard" class="mb-4 pb-4 border-b border-gray-200 hidden">
                            <div class="flex items-center justify-between mb-2">
                                <div class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Device Status</div>
                                <button id="refreshStatusBtn" title="Refresh"
                                    class="text-xs text-blue-600 hover:text-blue-800 px-1">↻</button>
                            </div>
                            <div class="space-y-1 text-sm">
                                <div class="flex items-center justify-between">
                                    <span class="text-gray-600">Firmware</span>
                                    <span id="statusVersion" class="font-mono text-gray-800">—</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="text-gray-600">Temperature</span>
                                    <span id="statusTemp" class="font-mono text-gray-800">—</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="text-gray-600">Battery</span>
                                    <span id="statusBattery" class="font-mono text-gray-800">—</span>
                                </div>
                            </div>
                            <div id="batteryWarning" class="mt-2 p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700 hidden">
                                ⚠️ Low battery — consider charging the cup
                            </div>
                        </div>

                        <h2 class="text-lg font-semibold mb-4">Functions</h2>
                        <ul id="functionList" class="space-y-2">
                            <li>
                                <button id="versionBtn"
                                    class="w-full text-left px-3 py-2 rounded hover:bg-gray-100">Read Version</button>
                            </li>
                            <li>
                                <button id="temperatureBtn"
                                    class="w-full text-left px-3 py-2 rounded hover:bg-gray-100">Read
                                    Temperature</button>
                            </li>
                            <li>
                                <button id="greetingBtn"
                                    class="w-full text-left px-3 py-2 rounded hover:bg-gray-100">Set Greeting
                                    Message</button>
                            </li>
                            <li>
                                <button id="dynamicModeBtn"
                                    class="w-full text-left px-3 py-2 rounded hover:bg-gray-100">Set Dynamic
                                    Mode</button>
                            </li>
                            <li>
                                <button id="imageEditorBtn"
                                    class="w-full text-left px-3 py-2 rounded hover:bg-gray-100">Set Static
                                    Image</button>
                            </li>
                            <li>
                                <button id="multiCupBtn"
                                    class="w-full text-left px-3 py-2 rounded hover:bg-gray-100 bg-blue-50 border-l-4 border-blue-500 font-semibold">🖼️
                                    Multi-Cup Display</button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Function Content Area -->
                <div class="md:w-3/4">
                    <div id="functionContent" class="bg-white rounded-lg shadow-md p-6">
                        <!-- Content will be loaded here based on selection -->
                        <div id="welcomeMessage" class="text-center py-12">
                            <h2 class="text-2xl font-semibold mb-2">Welcome to SGUAI App</h2>
                            <p class="text-gray-600">Select a function from the sidebar to get started</p>
                        </div>

                        <!-- Function panels (dynamically populated) -->
                        <div id="versionPanel" class="hidden"></div>
                        <div id="temperaturePanel" class="hidden"></div>
                        <div id="greetingPanel" class="hidden"></div>
                        <div id="dynamicModePanel" class="hidden"></div>
                        <div id="imageEditorPanel" class="hidden"></div>
                        <div id="multiCupPanel" class="hidden"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Rename Device Modal -->
    <div id="renameModal"
        class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full flex items-center justify-center z-50">
        <div class="relative p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Rename Device</h3>
                <div class="mt-2 px-7 py-3">
                    <input id="renameInput" type="text"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter new name">
                    <input id="renamePosition" type="hidden">
                </div>
                <div class="items-center px-4 py-3">
                    <button id="saveRenameBtn"
                        class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300">
                        Save
                    </button>
                    <button id="cancelRenameBtn"
                        class="mt-3 px-4 py-2 bg-gray-100 text-gray-700 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-300">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load scripts in order -->
    <script src="js/ble.js?v=35"></script>
    <script src="js/multiCupBLE.js?v=35"></script>
    <script src="js/imageSplitter.js?v=35"></script>
    <script src="js/ui.js?v=35"></script>
    <script src="js/omggif.js?v=35"></script>
    <script src="js/imageProcessor.js?v=35"></script>
    <script src="js/imageEditor.js?v=35"></script>
    <script src="js/main.js?v=35"></script>
</body>

</html>
