[project]
name = "smart-mug"
version = "0.1.0"
description = "Python BLE interface for SGUAI Smart Cup"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "bleak>=0.21.0",
    "pillow>=10.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
smart-mug = "smart_mug:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
